[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontario-forecast"
version = "0.1.0"
description = "Data pipeline and forecasting for the Connecting Ontario Sunstone proposal"
requires-python = ">=3.10"
# Runtime (pipeline + deployable model): no pandas.
dependencies = [
    "dlt[duckdb]>=1.4",
    "duckdb>=1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Analysis-time only. statsmodels imports pandas internally; it is used for
# unit-root tests in analysis/ and is never imported by the model.
analysis = ["matplotlib>=3.8", "statsmodels>=0.14"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ontario-ingest = "ontario_forecast.ingest.run:main"
ontario-transform = "ontario_forecast.transform.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ontario_forecast.transform" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
