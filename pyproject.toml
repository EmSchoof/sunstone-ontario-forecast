[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sunstone-ontario-forecast"
version = "0.1.0"
description = "Data pipeline and forecasting for the Connecting Ontario Sunstone proposal"
requires-python = ">=3.10"
# Runtime (pipeline + deployable model). The model itself imports only numpy + json.
dependencies = [
    "dlt[duckdb]>=1.4",
    "duckdb>=1.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Analysis & reporting. statsmodels/scipy are imported function-by-function
# (no statsmodels.api). statsmodels brings pandas; that stays out of model.py.
analysis = [
    "matplotlib>=3.8",
    "scipy>=1.11",
    "statsmodels>=0.15",   # result_object= argument on adfuller/kpss
]
dev = [
    "pre-commit>=3.7",
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
ontario-ingest = "ontario_forecast.ingest.run:main"
ontario-transform = "ontario_forecast.transform.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ontario_forecast.transform" = ["sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade, numpy-specific rules
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.per-file-ignores]
# Analysis scripts are cell-based: matplotlib backend must be set before later imports
"analysis/*.py" = ["E402", "E731"]

[tool.ruff.lint.isort]
known-first-party = ["ontario_forecast"]
