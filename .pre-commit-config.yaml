# Install once (from ontario_forecast_model/):  uv run pre-commit install
# Run on everything:                            uv run pre-commit run --all-files
# Generated outputs (charts, CSVs, fitted models, lockfiles) are written by tools, not people:
# don't rewrite them, or every regeneration would fail the commit again.
exclude: ^(outputs/|ontario_forecast_model/(pnpm-lock\.yaml|uv\.lock))
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff            # lint (+ safe autofixes)
        args: [--fix]
      - id: ruff-format     # formatter
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key          # never commit API keys
      - id: check-added-large-files     # block accidental data dumps
        args: [--maxkb=1024]
